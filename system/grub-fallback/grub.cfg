# Fallback GRUB for the G14: a standalone, Secure Boot signed GRUB that sits on the
# ESP next to the UKIs and is only used when picked from the firmware boot menu.
# build.sh embeds this file in the binary (memdisk); there is no grub.cfg on the
# ESP and nothing is read from outside the binary.
#
# Every entry chainloads a UKI through the firmware's LoadImage(): the firmware
# verifies the signature (db), and PCR 7 stays the same as in a direct UKI boot,
# so TPM auto-unlock keeps working. linux/initrd commands are NOT used.
#
# The binary is built with --disable-cli: 'e' (edit) and 'c' (command line) are
# disabled, so EVERY entry must be --unrestricted (otherwise
# grub_auth_check_authentication refuses access).

set timeout=5
set timeout_style=menu
set default=custom

# Text-mode colours, used if the theme or font cannot be loaded.
set color_normal=white/black
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

# Find the ESP by filesystem UUID (vfat, nvme0n1p1). `blkid -s UUID -o value /dev/nvme0n1p1`
search --no-floppy --fs-uuid --set=root <ESP-UUID>

# Theme: fonts and theme live in memdisk ($prefix = (memdisk)/boot/grub). Memdisk
# files are exempt from the verifier chain (kern/verifiers.c), so they load under
# Secure Boot lockdown. If anything fails, the menu stays in text mode.
if loadfont "${prefix}/fonts/jbm-regular-32.pf2"; then
  loadfont "${prefix}/fonts/jbm-bold-32.pf2"
  loadfont "${prefix}/fonts/jbm-regular-24.pf2"
  # Native panel resolution first, then "auto" (EFI GOP keeps the current mode).
  set gfxmode=2880x1800,auto
  if terminal_output gfxterm; then
    set theme="${prefix}/themes/black/theme.txt"
  else
    terminal_output console
  fi
fi

menuentry "Arch Linux (linux-lapidary)" --unrestricted --id custom {
  search --no-floppy --fs-uuid --set=root <ESP-UUID>
  chainloader /EFI/Linux/arch-linux-lapidary.efi
}

menuentry "Arch Linux (stock kernel)" --unrestricted --id stock {
  search --no-floppy --fs-uuid --set=root <ESP-UUID>
  chainloader /EFI/Linux/arch-linux.efi
}

menuentry "UEFI firmware settings" --unrestricted --id fwsetup {
  fwsetup
}

menuentry "Reboot" --unrestricted --id reboot {
  reboot
}

menuentry "Power off" --unrestricted --id halt {
  halt
}
