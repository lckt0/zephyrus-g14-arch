# /etc/mkinitcpio.conf -- Zephyrus G14 (GA403), systemd-based initramfs built as a UKI
#
# MODULES is intentionally empty:
#  - no nvidia modules: the dGPU is not needed for early KMS (the panel is driven by
#    the AMD iGPU) and the NVIDIA modules pull hundreds of MB of GSP firmware into
#    the image. If you ever need NVIDIA early KMS (e.g. MUX in dGPU-only mode), use:
#      MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)
#  - no amdgpu either: listing it here makes systemd-modules-load load it
#    synchronously, and the LUKS/TPM unlock then waits for it (about 1.2 s slower
#    initrd, measured on this machine). The local "amdkms" hook below adds the
#    module without forcing it, so udev loads it in parallel.
MODULES=()
BINARIES=()

# Patched EDID that exposes the OLED panel's HDR blocks to KWin. It must be inside
# the initramfs because the kernel reads it at boot (drm.edid_firmware= in
# /etc/kernel/cmdline). See docs/03 for how the file is made.
# If you do not use the EDID override, remove this line AND the cmdline parameter.
FILES=(/usr/lib/firmware/edid/g14-hdr.bin)

# systemd initramfs + sd-encrypt (reads /etc/crypttab entries marked x-initrd.attach).
# "amdkms" replaces the stock "kms" hook (see /etc/initcpio/install/amdkms).
# "plymouth" needs the plymouth package; drop it if you do not want a boot splash.
HOOKS=(base systemd plymouth autodetect microcode modconf amdkms keyboard sd-vconsole block sd-encrypt filesystems fsck)

COMPRESSION="zstd"
