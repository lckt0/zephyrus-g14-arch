# Optional: one fixed upstream resolver with DNS over TLS for every link.
# Pick your own resolver; FallbackDNS is empty on purpose so nothing leaks to
# the built-in fallback list when the upstream is unreachable.
[Resolve]
DNS=1.1.1.1
DNSOverTLS=yes
Domains=~.
FallbackDNS=
LLMNR=no
MulticastDNS=no
