# ROG Zephyrus G14 GA403GM: apply the upstream GA403U fixup to the ALC285 codec
# through an HDA "patch" firmware file (/usr/lib/firmware/alc285-g14-ga403gm.fw),
# without rebuilding the kernel. Upstream added the quirk in 7.3 (commit
# 140fe610af60); on 7.3+ this file and the .fw file can be removed.
#
# patch= is an ARRAY parameter. Its index is not the ALSA card number but the
# snd_hda_intel PROBE ORDER (sound/hda/controllers/intel.c:
# dev = find_first_zero_bit(probed_devs)). On this machine:
#   0 = 0000:64:00.1 (NVIDIA HDMI), 1 = 0000:65:00.1 (AMD HDMI), 2 = 0000:65:00.6 (ALC285)
# When the dGPU is switched off in firmware, 64:00.1 disappears and the ALC285
# moves to index 1. That is why the file is given for all three indices: its
# [codec] line only matches the 0x10ec0285 / 0x10431044 codec, so it is a no-op
# on the HDMI codecs.
#
# The snd modules are not in the UKI/initramfs, so this file and the firmware
# are read from the root filesystem; no UKI rebuild is needed. Takes effect on
# the next boot (or after reloading snd_hda_intel).

options snd_hda_intel patch=alc285-g14-ga403gm.fw,alc285-g14-ga403gm.fw,alc285-g14-ga403gm.fw

# --- Fallback if the patch file does not work ---
# options snd_hda_intel model=1043:1b13,1043:1b13,1043:1b13
