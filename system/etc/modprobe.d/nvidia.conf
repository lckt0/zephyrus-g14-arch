# NVIDIA module options for the ROG Zephyrus G14 (GA403GM, RTX 5060 Laptop).
# This file belongs to the AUR package nvidia-laptop-power-cfg; the only local
# change is PreserveVideoMemoryAllocations=1 (marked below).

options nvidia_drm modeset=1 fbdev=0

# DynamicPowerManagement=0x02      fine-grained runtime PM: the dGPU drops to
#                                  D3cold whenever nothing uses it
# EnableS0ixPowerManagement=1      let the dGPU sleep during s2idle as well
# PreserveVideoMemoryAllocations=1 (local) keep VRAM contents across suspend.
#   Required because nvidia-suspend/resume/hibernate.service are enabled;
#   without it resume logged "RmHandleDNotifierEvent failed" and the card
#   kept bouncing between D0 and D3cold. TemporaryFilePath is already set to
#   /var/tmp by /usr/lib/modprobe.d/nvidia-sleep.conf.
options nvidia NVreg_EnableS0ixPowerManagement=1 NVreg_DynamicPowerManagement=0x02 NVreg_PreserveVideoMemoryAllocations=1
