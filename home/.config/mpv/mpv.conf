# Hardware decoding + direct dmabuf presentation.
# With hwdec off, mpv decoded VP9 on the CPU: about 2.7 W more than the same
# video in the browser (measured on this machine, on battery).
hwdec=vaapi
vo=dmabuf-wayland
# On the 2880x1800 panel 1440p is enough; a 4K stream only costs bandwidth and decode power.
ytdl-format=bestvideo[height<=?1440][fps<=?60]+bestaudio/best

# Overlay planes (MPO): tag SDR video as gamma 2.2. With the default BT.1886
# tag KWin needs a gamma conversion and will not put the video on its own
# hardware plane; Windows also passes SDR video through without conversion.
# HDR (PQ/HLG) video is left alone.
[mpo-sdr-gamma22]
profile-cond=(function(g) return g ~= nil and g ~= "pq" and g ~= "hlg" end)(p["video-dec-params/gamma"])
profile-restore=copy
vf-append=format=gamma=gamma2.2
