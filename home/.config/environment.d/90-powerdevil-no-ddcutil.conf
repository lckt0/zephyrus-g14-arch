# Stop PowerDevil from probing every I2C bus with libddcutil for external
# monitor (DDC/CI) brightness at login. On the G14 this took ~15 s of 100% CPU
# with retry errors on one bus, and while DDC transactions run PowerDevil's
# main thread can block, so brightness keys stop responding.
# The internal panel's brightness is not affected; only DDC brightness control
# for external monitors is lost. Delete this file to undo.
POWERDEVIL_NO_DDCUTIL=1
