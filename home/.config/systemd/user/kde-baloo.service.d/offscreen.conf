# baloo_file_extractor (KF6) loads a Qt platform plugin. Early in the session,
# before WAYLAND_DISPLAY exists, loading wayland/xcb fails and the extractor
# aborts (SIGABRT) in a loop, filling coredumps and DrKonqi notifications.
# The indexer does not need a display.
[Service]
Environment=QT_QPA_PLATFORM=offscreen
